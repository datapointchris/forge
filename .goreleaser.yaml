version: 2

builds:
  - main: .
    binary: forge
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/cmd.version={{.Version}}
      - -X {{ .ModulePath }}/cmd.commit={{.ShortCommit}}
      - -X {{ .ModulePath }}/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "forge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
