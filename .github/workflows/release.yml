name: Release

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  # Generated by `forge ci generate`. Releasing without it shipped whatever was
  # on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  # govulncheck is not in the generated blocks yet, so it runs here rather than
  # not at all. Move it into the generator when the other repos adopt it.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  semver:
    needs: [validate, vulnerabilities]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: go-semantic-release/action@453e003c94ddb9c64e7ea4153794ef69e477259e # v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
          prepend: true

  goreleaser:
    needs: semver
    if: needs.semver.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ needs.semver.outputs.version }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
