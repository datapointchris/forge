name: Release

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  # Generated by `forge ci generate`. Releasing without it shipped whatever was
  # on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  semver:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: go-semantic-release/action@453e003c94ddb9c64e7ea4153794ef69e477259e # v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # No changelog-file: the release body is the changelog, and nothing here
          # tracks one.

  goreleaser:
    needs: semver
    if: needs.semver.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ needs.semver.outputs.version }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A tag exists before the module proxy has fetched it, and `go install
      # <module>@latest` resolves through that proxy. Inside the gap it returns
      # the previous version and exits 0, so the installer reports the machine
      # converged while leaving the old binary in place.
      #
      # Measured 2026-08-14 on v1.37.0: the release assets were up, the proxy
      # listed to v1.36.0, and `dotfiles packages apply --package forge` printed
      # "forge installed" twice without moving it.
      - name: Prime the module proxy
        env:
          VERSION: ${{ needs.semver.outputs.version }}
        run: |
          module="$(go list -m)"
          curl -fsS "https://proxy.golang.org/${module}/@v/v${VERSION}.info" || \
            echo "proxy has not picked up v${VERSION} yet; it will on first fetch"
