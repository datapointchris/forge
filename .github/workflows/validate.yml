# forge-toolchain: 23
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  go:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # > custom:before:go - actionlint, which the ci die's own assertions need
      # Without it TestTheDiesOwnLintRejectsThePoolLabelWithoutTheConfigAndAcceptsItWithOne
      # skips here and runs only when someone happens to run it locally. It is
      # installed for this repo alone rather than in the go block, because no
      # other repo's suite lints a workflow. FORGE_REQUIRE_ACTIONLINT turns a
      # later disappearance into a failure rather than another silent skip.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "FORGE_REQUIRE_ACTIONLINT=1" >> "$GITHUB_ENV"

      # uv, which runs the pyproject die's merge script. Without it every test
      # that runs the real script skips here, and the report the script prints
      # and the die decodes is checked only on a desk. FORGE_REQUIRE_UV turns a
      # later disappearance into a failure. The script's own suite runs beside it.
      - uses: astral-sh/setup-uv@v7
      - name: Require uv, and run the pre-commit script tests
        run: |
          echo "FORGE_REQUIRE_UV=1" >> "$GITHUB_ENV"
          pre-commit/scripts/run_tests.sh

      # generated:go
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "./go.sum"

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
