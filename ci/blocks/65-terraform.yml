# Terraform tests
      # Both steps run only where the root module carries tests, in the root or
      # in tests/, which are the two places `terraform test` reads. With none it
      # exits 0 reporting "0 passed, 0 failed", so a green step there would claim
      # tests that never ran. A skipped step says so.
      #
      # init without a backend: the tests need the providers resolved, and no
      # PR check should be touching real state.
      - name: terraform init
        if: hashFiles('{{dir}}/*.tftest.hcl', '{{dir}}/tests/*.tftest.hcl') != ''
        run: terraform init -backend=false

      - name: terraform test
        if: hashFiles('{{dir}}/*.tftest.hcl', '{{dir}}/tests/*.tftest.hcl') != ''
        run: terraform test
