# Go setup
      # Shared by the go job and the hooks job, whose go-vet, go-build,
      # go-mod-tidy and go-test hooks call the go on PATH.
      - uses: actions/setup-go@{{pin}}
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "{{dir}}/go.mod"
          cache: {{gocache}}
          cache-dependency-path: "{{dir}}/go.sum"
