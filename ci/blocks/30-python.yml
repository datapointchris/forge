# Python tests
      # enable-cache is left at setup-uv's `auto`, which caches on a hosted
      # runner only. Every repo's self-hosted runner shares one ~/.cache/uv
      # that outlives the job, so there the post step's prune and upload are
      # work the disk already did, and two jobs pruning at once collide on the
      # same files. version is the release the uv-lock hook pins, so the sync
      # here and the lock check in the hooks job run one uv.
      - name: Install uv
        uses: astral-sh/setup-uv@{{pin}}
        with:
          version: "{{pin}}"

      - run: uv sync --all-extras --dev

      # --with pytest, so a repo whose suite never declared pytest as a
      # dependency still runs it rather than skipping it. A suite needing
      # plugins declares those itself.
      #
      # pytest exits 5 when it collects nothing, which is not a failure for a
      # repo that has no tests yet. Written explicitly rather than as an && chain
      # because the runner uses `bash -e`, where the concise form depends on
      # subtle errexit-exemption rules.
      - name: Test
        run: |
          set +e
          uv run --with pytest pytest
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit 1
