# Vue
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          cache-dependency-path: "{{dir}}/package-lock.json"

      - run: npm ci

      - run: npm run lint

      - run: npm run build
