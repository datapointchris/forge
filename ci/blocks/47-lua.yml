# Lua
# covers: stylua-github
      # --check, not the formatting run the pre-commit hook does: CI reports,
      # it does not rewrite the tree.
      #
      # The version is the release the StyLua hook pins, which is the release
      # that hook downloads, so CI and the hook grade with one binary.
      - name: StyLua
        run: |
          stylua_version="{{pin}}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${stylua_version}/stylua-linux-x86_64.zip"
          unzip -o -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          stylua_bin="$RUNNER_TEMP/stylua/stylua"
          "$stylua_bin" --version
          "$stylua_bin" --check .
