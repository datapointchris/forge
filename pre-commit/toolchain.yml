# Single source of truth for every pinned tool version forge rolls out.
#
# Blocks keep their own `rev:` lines so each block stays readable and valid on
# its own, but generation overwrites them from this file — the manifest wins.
# A test asserts every remote repo across the blocks appears here, so a new
# block cannot quietly introduce an unmanaged version.
#
# `version` is stamped into each generated config as `# forge-toolchain: N`.
# That stamp is what makes a staged rollout possible: bump a tool, bump the
# version, resync one repo, verify, then fan out. Without it there is no way to
# ask which repos are on the current standard.
#
# Bump `version` on any change below, or on any change to the set of blocks —
# the stamp answers "is this repo on the current standard", which a new block
# changes just as much as a new rev does.
version: 14

hooks:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
  # Tag tracks the shfmt release it wraps, so this pin and the `shfmt` binary
  # below stay legible as the same version.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
  - repo: https://github.com/datapointchris/refcheck
    rev: v0.5.0
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.3
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.5

# GitHub Actions used by generated CI workflows. Pinned here so an action
# version is declared in the same place as a pre-commit hook version.
actions:
  - uses: actions/checkout
    version: v7
  - uses: actions/setup-go
    version: v7
  - uses: actions/setup-node
    version: v7
  - uses: actions/setup-python
    version: v6
  - uses: astral-sh/setup-uv
    version: v7
  - uses: JohnnyMorganz/stylua-action
    version: v4
  - uses: hashicorp/setup-terraform
    version: v3

# CLIs generated CI installs with `go install <module>@<version>`.
tools:
  - module: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
    version: v2.12.2
  - module: golang.org/x/vuln/cmd/govulncheck
    version: v1.6.0

# Tools generated CI downloads from a GitHub release, for tools with no module
# ecosystem to install from. Kept at the same version as the corresponding
# pre-commit hook so CI and the local hook cannot disagree about a finding.
binaries:
  - name: shellcheck
    version: "0.10.0"
  - name: shfmt
    version: "3.13.1"
  # bats and its two helper libraries are cloned by tag in CI. bashselfupdate's
  # bespoke workflow cloned all three from main at --depth 1, so the test
  # tooling moved underneath the suite with nothing recording which version a
  # green run had used.
  - name: bats
    version: "1.14.0"
  - name: bats_support
    version: "0.3.0"
  - name: bats_assert
    version: "2.2.4"

# Language runtimes pinned for generated CI.
runtimes:
  - name: node
    version: "24"
