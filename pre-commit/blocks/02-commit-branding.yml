  # Strip AI branding from commit messages
  - repo: local
    hooks:
      - id: prepare-commit-msg
        name: Strip AI branding from commits
        # $HOME, not a literal path: pre-commit execs entry without a shell, and
        # the same repo is committed from more than one home directory.
        #
        # Skips cleanly when the hook is absent. This config ships in public
        # repos, and a clone that cannot find a machine-local hook must still be
        # able to run `pre-commit` rather than failing on a missing file.
        entry: bash -c 'h="$HOME/.claude/hooks/prepare-commit-msg"; [ -x "$h" ] || exit 0; exec "$h" "$@"' --
        language: system
        always_run: true
        stages: [prepare-commit-msg]
