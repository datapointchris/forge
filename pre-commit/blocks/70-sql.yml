  # SQL
  # Lint only, never fix: sqlfluff's fixer rewrites whole statements, and a
  # hook that reformats migrations under you is one nobody trusts.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, "{{dialect}}", --config, .sqlfluff]
