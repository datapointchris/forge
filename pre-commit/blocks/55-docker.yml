  # Docker
  #
  # hadolint-py installs hadolint's own release binary through pip and checks
  # its sha256, so the hook needs no Docker daemon and no system package. Its
  # tag is the hadolint release it installs.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: "{{pin}}"
    hooks:
      # DL3018 is DL3008's apk counterpart — the same "pin every package
      # version" rule, for an Alpine base rather than a Debian one. Ignoring one
      # and enforcing the other only means the Debian images pass and the Alpine
      # ones do not; pinning a package version in either breaks on the next base
      # image bump.
      #
      # The exclude is not about rules. hadolint matches on the Dockerfile name,
      # and BuildKit's per-file ignore list is named <dockerfile>.dockerignore,
      # so a repo using one gets a file whose name hadolint reads as a
      # Dockerfile. It then parses an ignore list and fails on its first glob.
      - id: hadolint
        args: ["--ignore", "DL3008", "--ignore", "DL3018", "--ignore", "DL4006"]
        exclude: '\.dockerignore$'

  # Docker Compose's own parser reads each compose file alone. Interpolation
  # is off, because the .env a file's ${VARIABLES} read is gitignored, so a
  # checkout holds none, and a required ${VARIABLE:?} fails without it.
  # --no-env-resolution leaves each service's env_file unopened for the same
  # reason. A repo whose files interpolate from a committed env file declares
  # them as compose_projects, which the next block parses merged.
  #
  # `language: system` runs the desk's `docker compose`, so a box without the
  # compose plugin fails here rather than passing a compose change unread. CI's
  # hooks job installs the pinned release first. Parsing needs no daemon.
  - repo: local
    hooks:
      - id: docker-compose-config
        name: docker compose config on each compose file
        entry: bash -c 'docker compose version > /dev/null 2>&1 || { echo "docker compose is not on this machine, and the hook parses compose files with it" >&2; exit 1; }; for file in "$@"; do docker compose -f "$file" config --quiet --no-env-resolution --no-interpolate || { echo "$file does not parse" >&2; exit 1; }; done' --
        language: system
        files: '(^|/)(docker-)?compose([.-][^/]*)?\.ya?ml$'
