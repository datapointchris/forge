  # Reference checking
  #
  # `--moves` is what earns this a place on every commit, and running without
  # it would be close to running nothing. Measured across all 49 active repos:
  # the whole-tree half — every `source` and `bash` target — found zero real
  # errors, because the portfolio is already clean. The moves half asks the
  # question a rename actually leaves behind, for each one in the changeset,
  # and that is where the findings are: call sites and documented commands
  # still naming a path that moved.
  #
  # Deliberately no path spelled out above. A comment naming a real old path
  # is itself a hit for it, in every repo this block is deployed to.
  #
  # Generic rather than shell-gated, because a pattern is language-agnostic:
  # the hits landed in Go, Vue and Python repos as readily as in dotfiles, in
  # YAML and prose as readily as in scripts. The compiled languages catch their
  # own broken *imports*, which is a different question from what a doc, a
  # Dockerfile or a shell wrapper still says.
  #
  # No --strict: one advisory warning across the whole fleet, and a warning is
  # about fragility rather than breakage.
  - repo: https://github.com/datapointchris/refcheck
    rev: v0.5.2
    hooks:
      - id: refcheck
        args: [--moves]
