  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      # Lock files are generated and mostly integrity hashes, so a base64
      # fragment reads as a typo — two of timeline's package-lock.json hashes
      # each contained a two-letter sequence codespell corrects. Nobody writes
      # prose in them and nobody would fix a hit, since the next install would
      # put it back.
      - id: codespell
        # The second alternation is sops output. Ciphertext is base64, so it
        # produces the same false hits a lock file's hashes do. The plain
        # `secrets.yaml` name is covered alongside the *.enc.env convention.
        #
        # `go.mod` sits beside `go.sum` for the same reason one step earlier: it
        # is mostly module paths, and a path is a third party's name rather than
        # prose anyone here can correct. Adding sqlc to fleet pulled in a
        # `sqlc-dev` module whose name codespell wants hyphenated, and no edit
        # could fix it — the next `go mod tidy` writes it straight back. Naming
        # it here would trip this hook on this very file, which is how the rule
        # was found.
        exclude: '(^|/)(.*-lock\.json|.*\.lock|uv\.lock|package-lock\.json|go\.sum|go\.mod|secrets?[^/]*\.(ya?ml|env|json)|.*\.enc\.[^/]+)$'
