  # Lua
  # The release binary, installed from npm at the StyLua hook's rev. StyLua's
  # own cargo hook builds without the Lua 5.2 and LuaJIT syntaxes, so it cannot
  # parse a goto label, which Neovim's LuaJIT runs. stylua-github finds the
  # release through GitHub's API unauthenticated, and a spent hourly budget
  # blocks every commit. The npm package takes the same release's binary from
  # the npm registry.
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua
        language: node
        additional_dependencies:
          - "@johnnymorganz/stylua-bin@{{pin}}"
        types: [lua]
