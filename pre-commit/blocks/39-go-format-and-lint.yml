  # Go formatting and lint, at the release CI installs
  # pre-commit installs each tool into an environment of its own, from the
  # module and version below, which is the release generated CI installs. A hook
  # running the copy on PATH passes or fails by what that machine last
  # installed, and gofumpt writes, so two releases rewrite each other's output.
  #
  # One pair per declared Go directory, because golangci-lint loads packages
  # from the go.mod it starts beside. Filenames are never passed to it for the
  # same reason as the vue block: they arrive repo-root-relative.
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w
        language: golang
        additional_dependencies:
          - mvdan.cc/gofumpt@{{pin}}
        types: [go]
        files: '^{{dirprefix}}'

      # --allow-parallel-runners, because golangci-lint locks a cache under
      # $HOME, and two worktrees committing at once would meet on it.
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd {{dir}} && exec golangci-lint run --allow-parallel-runners'
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{pin}}
        pass_filenames: false
        types: [go]
        files: '^{{dirprefix}}'
