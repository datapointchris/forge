  # Rust
  #
  # One pair per declared Rust directory, each run from inside it, where cargo
  # finds that directory's Cargo.toml. A workspace in crates/ has no manifest at
  # the root, so a cargo call there fails before checking anything. Filenames
  # are never passed, so files only decides when they fire.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd {{dir}} && exec cargo fmt'
        language: system
        types: [rust]
        pass_filenames: false
        files: '^{{dirprefix}}'
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd {{dir}} && exec cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
        files: '^{{dirprefix}}'
