  # Go
  # Every -repo- hook runs in each go.mod it finds, so a repo holding api/ and
  # cli/ needs no hook per module.
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-fumpt-repo
        args: [-w]
      - id: go-vet-repo-mod
      - id: go-build-repo-mod
      - id: go-mod-tidy-repo
      - id: go-test-repo-mod
        # A commit gate runs the fast tests; CI runs everything. Without this a
        # repo with DB integration tests has to keep a hook of its own.
        args: [-short]
      - id: golangci-lint-repo-mod

  # A breaking commit must carry its go.mod major, because the tag is cut from
  # this tree after the merge and a tag whose go.mod declares a lower major is
  # unservable forever. The failure is silent: `go install ...@latest` then
  # returns the old major's newest version instead of erroring. Five repos were
  # doing exactly that before anyone asked the proxy.
  #
  # commit-msg, not CI: CI runs after the commit exists, and the whole point is
  # that the bump has to be IN the commit that triggers the major.
  - repo: local
    hooks:
      - id: go-module-major
        name: Breaking commit carries its go.mod major
        # $HOME, not a literal path: pre-commit execs entry without a shell, and
        # the same repo is committed from both /Users/chris and /home/chris.
        entry: bash -c 'exec "$HOME/.local/bin/go-module-major-check" "$@"' --
        language: system
        always_run: true
        stages: [commit-msg]
