# Standard tool configuration for Python repos.
# Append to pyproject.toml or merge into existing [tool.*] sections.
# Project-specific overrides (codespell skip patterns, mypy plugins, extra
# per-file-ignores, etc.) should be added after these base settings.
#
# The rule set is deliberately the six every repo already runs. Widening it is
# a deliberate piece of work with fallout to fix, not something a config sync
# should carry along.

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# `standard` replaces the per-rule opt-outs repos used to accumulate; basedpyright
# defaults to `recommended`, which turns every one of them back on. Named
# `pyright` so both basedpyright and Pylance read it.
[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.codespell]
check-filenames = true

[tool.pytest.ini_options]
addopts = "-vv"
minversion = "8.0"
testpaths = ["tests"]
