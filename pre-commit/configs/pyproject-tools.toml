# Standard tool configuration for Python repos.
# Append to pyproject.toml or merge into existing [tool.*] sections.
# Project-specific overrides (codespell skip patterns, mypy plugins, extra
# per-file-ignores, etc.) should be added after these base settings.
#
# The rule set is deliberately the rules every repo already runs. Widening it is
# a deliberate piece of work with fallout to fix, not something a config sync
# should carry along: a rule lands here after the sweep that makes the fleet
# pass it.

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "ICN",  # flake8-import-conventions
    # flake8-bandit by rule, never as the family. Most of what the family
    # reports is a subprocess call made on purpose, and silencing that takes an
    # ignore list that grows with every project.
    "S102",  # exec
    "S113",  # an HTTP request with no timeout, which can hang forever
    "S301",  # pickle, which runs code from the bytes it loads
    "S307",  # eval
    "S324",  # md5 or sha1 used for security
    "S501",  # TLS certificate verification turned off
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

# Importing any of these modules' members by name is the fault itself.
# `from datetime import datetime` makes one name a module in some files and a
# class in others. pyspark.sql.functions exports `sum`, `min`, `max`, `abs`,
# `round` and `filter`, each shadowing the builtin, so a by-name import turns a
# later `sum()` over a list into a Column with nothing at the call site to say so.
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "pyspark.sql.functions", "pyspark.sql.types"]

# `extend-aliases`, not `aliases`: `aliases` replaces ruff's defaults (`pd`,
# `np`, `plt` and the rest) rather than adding to them. The Spark pair is
# lowercase because PEP 8 reserves a capital for a class, and `F.col` reads as a
# method on one. `sqlalchemy` is aliased and not banned, because SQLAlchemy's
# own documentation imports `select` and `Session` by name. `dataclasses` is
# aliased and not banned, because none of its names collides with anything, so
# `from dataclasses import dataclass` stays legal.
[tool.ruff.lint.flake8-import-conventions.extend-aliases]
datetime = "dt"
dataclasses = "dc"
sqlalchemy = "sa"
"pyspark.sql.functions" = "sf"
"pyspark.sql.types" = "st"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# `standard` is set here so a repo needs no per-rule opt-outs of its own.
# basedpyright defaults to `recommended`, which turns every one of them back on.
# Named `pyright` so both basedpyright and Pylance read it.
[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.codespell]
check-filenames = true
# These two restate what the pre-commit hook passes as args, and the repetition
# is the point: the hook's args reach the hook alone, while `codespell <path>`
# typed at a terminal reads this file instead. A hand-run is how every manual
# check in a repo is made, so without these it runs a different check from the
# gate and reports a different set.
#
# `check-hidden` because codespell skips any file whose basename starts with a
# dot and exits 0 rather than saying it read nothing. It skips one named
# explicitly on the command line too, so an exact path is no defense. Measured
# against a dot-named file carrying a known finding: silent without it, reported
# with it.
#
# `builtin` because naming any dictionary replaces the list rather than adding
# to it, so `clear,rare` — codespell's own default — is restated rather than
# assumed.
#
# Dialect is deliberately not a dictionary here. A commit is the wrong place to
# catch a British spelling: by then the word is written, and the only move left
# is a sweep of text that already exists. The `british-spelling` rule reports it
# on the line as it is typed, which reaches every repo rather than only the ones
# with pre-commit, and reaches an identifier — which codespell cannot, since it
# matches whole tokens.
#
# `uri-ignore-words-list` because an address is a third party's name, so
# respelling one breaks the link rather than fixing a typo. The word is still
# checked everywhere outside a URL in the same file, which narrows the context
# rather than switching the word off.
check-hidden = true
builtin = "clear,rare"
uri-ignore-words-list = "*"

[tool.pytest.ini_options]
# Assertion detail and test-list length are two different questions, and -vv
# answers both at once. A failing assertion truncates its diff and prints "use
# -vv to show", so a reader who wants the diff re-runs the whole suite to get
# it — which is the loop this setting exists to break. Raising assertion
# verbosity alone gives the full diff on the first run and leaves a green run
# silent. On a suite of a few thousand tests that is the difference between
# thousands of lines of output and tens, with no failure detail lost.
verbosity_assertions = 2
minversion = "8.0"
testpaths = ["tests"]
