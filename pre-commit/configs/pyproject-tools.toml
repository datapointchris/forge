# Standard tool configuration for Python repos.
# Append to pyproject.toml or merge into existing [tool.*] sections.
# Project-specific overrides (codespell skip patterns, mypy plugins, extra
# per-file-ignores, etc.) should be added after these base settings.
#
# The rule set is deliberately the six every repo already runs. Widening it is
# a deliberate piece of work with fallout to fix, not something a config sync
# should carry along.

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# `standard` is set here so a repo needs no per-rule opt-outs of its own.
# basedpyright defaults to `recommended`, which turns every one of them back on.
# Named `pyright` so both basedpyright and Pylance read it.
[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.codespell]
check-filenames = true
# These two restate what the pre-commit hook passes as args, and the repetition
# is the point: the hook's args reach the hook alone, while `codespell <path>`
# typed at a terminal reads this file instead. A hand-run is how every manual
# check in a repo is made, so without these it runs a different check from the
# gate and reports a different set.
#
# `check-hidden` because codespell skips any file whose basename starts with a
# dot and exits 0 rather than saying it read nothing. It skips one named
# explicitly on the command line too, so an exact path is no defense. Measured
# against a dot-named file carrying a known finding: silent without it, reported
# with it.
#
# `builtin` because naming any dictionary replaces the list rather than adding
# to it, so `clear,rare` — codespell's own default — is restated beside the
# third. The two carry different corrections, a typo and a spelling, so a run
# with one list says nothing about what the other would find.
#
# `uri-ignore-words-list` because an address is a third party's name, so
# respelling one breaks the link rather than fixing a typo. The word is still
# checked everywhere outside a URL in the same file, which narrows the context
# rather than switching the word off.
check-hidden = true
builtin = "clear,rare,en-GB_to_en-US"
uri-ignore-words-list = "*"

[tool.pytest.ini_options]
# Assertion detail and test-list length are two different questions, and -vv
# answers both at once. A failing assertion truncates its diff and prints "use
# -vv to show", so a reader who wants the diff re-runs the whole suite to get
# it — which is the loop this setting exists to break. Raising assertion
# verbosity alone gives the full diff on the first run and leaves a green run
# silent. On a suite of a few thousand tests that is the difference between
# thousands of lines of output and tens, with no failure detail lost.
verbosity_assertions = 2
minversion = "8.0"
testpaths = ["tests"]
