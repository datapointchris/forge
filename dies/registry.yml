dies:
  checks/pre-commit-config.sh:
    description: "Check that a .pre-commit-config.yaml (or .yml) exists and sets default_stages when it uses non-pre-commit stages."
    tags: [checks, pre-commit, linting, stages]
  checks/has-pre-commit.sh:
    description: "Check that repo has a .pre-commit-config.yaml and report hook count."
    tags: [checks, pre-commit, scorecard]
  checks/has-claude-md.sh:
    description: "Check that repo has a CLAUDE.md and report its size."
    tags: [checks, claude, scorecard]
  checks/has-planning-dir.sh:
    description: "Check that repo has a .planning/ directory and report file count."
    tags: [checks, planning, scorecard]
  maintenance/sync-planning.sh:
    description: "Sync .planning/ to ~/dev/repos/{name}/planning/ via symlink for Syncthing. Migrates real dirs. Idempotent."
    tags: [planning, symlink, syncthing, setup]
  checks/can-generate.sh:
    description: "Verify forge can generate a valid pre-commit config and CI workflow for the repo, writing nothing. Run across the portfolio before bumping the toolchain manifest."
    tags: [ci, pre-commit, standardization, verification]
  maintenance/sync-ci.sh:
    description: "Generate .github/workflows/validate.yml from standard CI blocks based on detected tech stack. Aborts on a hand-written validate.yml."
    tags: [ci, standardization, golden-path]
  maintenance/sync-pre-commit.sh:
    description: "Sync .pre-commit-config.yaml from standard blocks based on detected tech stack. Preserves project hooks."
    tags: [pre-commit, standardization, golden-path]
  maintenance/sync-pyproject.sh:
    description: "Merge standard [tool.*] sections into a Python repo's pyproject.toml, without regenerating the pre-commit config. Idempotent; SKIP means already current."
    tags: [python, pyproject, standardization, golden-path]
    supports_check: true
  maintenance/sync-merge-settings.sh:
    description: "Set the GitHub merge commit title to the PR title and its body to the PR body, and delete the branch on merge, so a merged PR reads as the work rather than 'Merge pull request #N from ...'. Changes repo settings, not files; commits nothing. SKIP means already current, or a non-GitHub remote."
    tags: [github, pr, merge, standardization]
    supports_check: true
  maintenance/sync-branch-protection.sh:
    description: "Block force-push and deletion on the default branch, with enforce_admins so the sole admin is subject to it too. Deliberately adds no review or PR requirement: those deadlock a solo repo and would forbid direct-to-main commits. Changes repo settings, not files; commits nothing. SKIP means already current, a non-GitHub remote, or a private repo without a paid plan."
    tags: [github, branches, safety, standardization]
    supports_check: true
  maintenance/rename-master-to-main.sh:
    description: "Rename master branch to main (local + remote + GitHub default). Idempotent."
    tags: [git, branches, maintenance]
